- id: e164-phone-numbers
  conforms: true
  evidence: Text Message API requires E.164 formatted phone numbers.
- id: sha256-hashed-identifiers
  conforms: true
  evidence: >-
    Identity surfaces exchange SHA-256 email hashes (Identity API responses,
