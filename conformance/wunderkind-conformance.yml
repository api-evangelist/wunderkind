    confidentiality, audited by A-LIGN, and states the certification was
    renewed in 2024 (https://www.wunderkind.co/blog/article/soc-2-attestation/).
    A trust center exists at https://trust.wunderkind.co/ (Vanta) but its
    report list is not machine-readable.
- id: iso-27001
  conforms: claimed
  evidence: >-
    "renewed both our SOC2 and ISO 27001 certifications" — Wunderkind, 2024
