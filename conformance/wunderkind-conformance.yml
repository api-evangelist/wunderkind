standards:
- id: oauth2
  conforms: false
  evidence: No oauth2 securitySchemes in any harvested spec; auth is API keys, header pairs, and Bearer JWT.
- id: oidc
  conforms: false
  evidence: /.well-known/openid-configuration returns 404/500 on all hosts.
- id: rfc9457-problem-details
  conforms: false
  evidence: No application/problem+json; per-API ad hoc error envelopes (see errors/wunderkind-problem-types.yml).
- id: rfc9116-security-txt
  conforms: false
  evidence: /.well-known/security.txt not published on any probed host.
- id: rfc8594-sunset
  conforms: false
  evidence: No Sunset/Deprecation header support documented.
- id: json-api
  conforms: false
  evidence: Plain JSON bodies; no JSON:API media type.
- id: grpc-transcoding
  conforms: true
  evidence: >-
    Event Ingestion OpenAPI is grpc-gateway generated (protobufAny,
    rpcStatus components, Service_* operationIds), i.e. gRPC services
