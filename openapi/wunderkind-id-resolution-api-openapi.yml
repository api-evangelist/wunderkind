      tags:
      - Id Resolution
      summary: Post id resolutionv1identityenckey
      x-summary-source: derived
    get:
      description: ''
      operationId: get_id-resolutionv1identityenckey
      responses:
        '200':
          description: ''
      parameters: []
      tags:
      - Id Resolution
      summary: Get id resolutionv1identityenckey
      x-summary-source: derived
    servers:
    - url: //api.wunderkind.co
  //id-resolution/v1/identity/enckey:
    get:
      description: ''
      operationId: get_id-resolutionv1identityenckey
      responses:
        '200':
          description: ''
      parameters: []
      tags:
