openapi: 3.0.0
info:
  title: Event Ingestion API
  version: '2025-01-12'
paths:
  /events/add-to-cart:
    post:
      summary: Add to Cart
      description: Records that a user has added an item to their cart
      operationId: Service_AddToCart
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventsSubmitEventResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/eventsAddToCartEvent'
        required: true
      tags:
      - Send Event
  /events/app-push-action:
    post:
      summary: App Push Action
      description: Records that a push notification was delivered to a device
      operationId: Service_AppPushAction
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventsSubmitEventResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/eventsAppPushActionEvent'
        required: true
      tags:
      - Send Event
  /events/app-push-toggle:
    post:
      summary: Device AppPush Toggle
      description: Records that a device toggled app push notifications
      operationId: Service_AppPushToggle
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventsSubmitEventResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/eventsAppPushToggleEvent'
        required: true
      tags:
      - Send Event
  /events/app-push-token-set:
    post:
      summary: Device AppPush Token Set
      description: Records that a device set a new app push token
      operationId: Service_AppPushTokenSet
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventsSubmitEventResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/eventsAppPushTokenSetEvent'
        required: true
      tags:
      - Send Event
  /events/custom:
    post:
      summary: Custom Event
      description: Records a custom event with a dynamic title/name
      operationId: Service_Custom
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventsSubmitEventResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/eventsCustomEvent'
        required: true
      tags:
      - Send Event
  /events/empty-cart:
    post:
      summary: Empty Cart
      description: Records that a user has emptied their cart. This event should only be triggered when
        a user has items in their cart and empties it. Not every time a user opens their empty cart.
      operationId: Service_EmptyCart
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventsSubmitEventResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/eventsEmptyCartEvent'
        required: true
      tags:
      - Send Event
  /events/order-transaction:
    post:
      summary: Order Transaction
      description: Records that a user has completed an order transaction. Must be sent in addition to
        the page view event.
      operationId: Service_OrderTransaction
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventsSubmitEventResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/eventsOrderTransactionEvent'
        required: true
      tags:
      - Send Event
  /events/page-view:
    post:
      summary: Page View
      description: Records that a user has viewed a page; this should also include data of the viewed
        category, search, and/or items.
      operationId: Service_Pageview
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventsSubmitEventResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/eventsPageViewEvent'
        required: true
      tags:
      - Send Event
  /events/track-link:
    post:
      summary: Track Link Event
      description: This should be emitted each time a deep link opens into a mobile application only.
        Pass all deeplink URL in their final form including all URL parameters. If this is a shortened
        URL (e.g. URL) - please resolve/convert to the final URL before passing.
      operationId: Service_TrackLink
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventsSubmitEventResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/eventsTrackLinkEvent'
        required: true
      tags:
      - Send Event
  /events/user-identified:
    post:
      summary: User Identified
      description: Records that a user has been identified. Should include as much information on the
        user as possible.
      operationId: Service_UserIdentified
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventsSubmitEventResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/eventsUserIdentifiedEvent'
        required: true
      tags:
      - Send Event
  /events/visit:
    post:
      summary: Visit/Session Started
      description: Records that a user visit/session
      operationId: Service_Visit
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventsSubmitEventResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/eventsVisitEvent'
        required: true
      tags:
      - Send Event
  /id-resolution/v1/identity/lookup/batch:
    post:
      description: ''
      operationId: post_id-resolutionv1identitylookupbatch
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      properties:
                        device_id:
                          type: string
                          default: '123456789'
                        email:
                          type: string
                          description: Sha256 email hash
                          default: b36a83701f1c3191e19722d6f90274bc1b5501fe69ebf33313e440fe4b0fe210
                      type: object
                required:
                - results
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
      parameters:
      - in: header
        name: Authorization
        schema:
          type: string
          default: apikey {apikey}
          enum:
          - apikey {apikey}
        description: This header is expected to be set according to the pattern below, where {apikey}
          is client's private key created on Wunderkind Platform. See https://developer.wunderkind.co/docs/authenticate-api-requests#/
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                website_id:
                  type: string
                  description: The website ID that the lookup will be performed for.
                device_ids:
                  type: string
                  description: A list of WKND device IDs (at least one). Each item should be a valid deviceID.
              required:
              - website_id
              - device_ids
  //v1/identity/lookup:
    post:
      description: ''
      operationId: get_v1identitylookup
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  external_id:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      encryption_key_name:
                        type: string
                    required:
                    - id
                    - name
                required:
                - external_id
              examples:
                OK:
                  summary: OK
                  value:
                    external_id:
                      id: string
                      name: encrypted_email_hash
                      encryption_key_name: string
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
      parameters:
      - in: header
        name: Content-Type
        schema:
          type: string
        description: Must be application/json
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  device_id:
                    type: string
                    description: ''
                  website_id:
                    type: string
                    description: ''
                  external_id_type:
                    type: string
                    enum:
                    - encrypted_email_hash
                    - '{client-specific}'
                required:
                - device_id
                - website_id
                - external_id_type
                title: Lookup by device id
              - type: object
                properties:
                  email_hash:
                    type: string
                  website_id:
                    type: string
                  external_id_type:
                    type: string
                    enum:
                    - encrypted_email_hash
                    - '{client-specific}'
                required:
                - email_hash
                - website_id
                - external_id_type
                title: Lookup by email hash
              - type: object
                properties:
                  soft_id:
                    type: string
                  website_id:
                    type: string
                  external_id_type:
                    type: string
                    enum:
                    - encrypted_email_hash
                    - '{client-specific}'
                required:
                - soft_id
                - website_id
                - external_id_type
                title: Lookup by soft id
      x-readme:
        code-samples:
        - code: "curl -X POST /v1/identity/lookup \\  \n  -H 'Content-Type: application/json' \\  \n \
            \ -d '{  \n     \"website_id\": \"1234\",\n     \"external_id_type\": \"crm_id\",\n     \"\
            device_id\": \"123456789\"\n}'"
          language: shell
          name: ''
        samples-languages:
        - shell
  /id-resolution/v1/identity/enckey:
    post:
      description: ''
      operationId: post_id-resolutionv1identityenckey
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  key_base64:
                    type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '404':
          description: Not Found
          content: {}
      parameters:
      - in: header
        name: Authorization
        schema:
          type: string
        description: This header is expected to be set according to the pattern below, where {apikey}
          is client's private key created on Wunderkind Platform. See https://developer.wunderkind.co/docs/authenticate-api-requests#/
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {}
      x-readme:
        code-samples:
        - code: ''
          language: shell
          name: ''
        samples-languages:
        - shell
    get:
      description: ''
      operationId: get_id-resolutionv1identityenckey
      responses:
        '200':
          description: ''
      parameters: []
  //id-resolution/v1/identity/enckey:
    get:
      description: ''
      operationId: get_id-resolutionv1identityenckey
      responses:
        '200':
          description: ''
      parameters: []
servers:
- url: //api.wunderkind.co
components:
  schemas:
    eventsAddToCartEvent:
      type: object
      properties:
        identification:
          $ref: '#/components/schemas/eventsIdentification'
        itemId:
          type: string
          example: '123456'
          description: The unique identifier for the item as defined by the partner. This represents the
            parent identifier for the item. For example, if you sell similar shirts, they may have the
            same parent id, but a different sku for each size / color combination
        sku:
          type: string
          example: SKU123
          description: The SKU of the item as defined by the partner. This represents the child identifier
            for the item. For example, if you sell similar shirts, they may have the same parent id, but
            a different sku for each size / color combination. This is optional, but should be included
            if available.
        cartToken:
          type: string
          example: '123456'
          description: The unique identifier for the cart as defined by the partner. Contains the value
            of the cart cookie on the platform. Only needed for cookie based cart replenishment
        extra:
          type: object
          example:
            color: red
            size: large
          additionalProperties:
            type: string
          description: Any additional attributes, may be passed empty.
        agent:
          type: string
          example: partner:mparticle
          description: The agent from which the event was sent
        timestamp:
          type: string
          format: int64
          example: 1611312000
          description: The timestamp of the event in milliseconds since the unix epoch
        websiteId:
          type: string
          format: int64
          example: 123456
          description: The unique identifier for the website as provided by Wunderkind
      required:
      - identification
      - itemId
      - cartToken
      - extra
      - agent
      - timestamp
      - websiteId
    eventsAppPushActionEvent:
      type: object
      properties:
        common:
          $ref: '#/components/schemas/eventsCommon'
        wunderkindPayload:
          type: object
          description: Key-value pairs supporting string keys with any value type
        appPushActionType:
          $ref: '#/components/schemas/eventsAppPushActionType'
      required:
      - common
      - wunderkindPayload
      - appPushActionType
    eventsAppPushActionType:
      type: string
      enum:
      - opened
      - delivered
    eventsAppPushToggleEvent:
      type: object
      properties:
        common:
          $ref: '#/components/schemas/eventsCommon'
        toggle:
          type: boolean
      required:
      - common
      - toggle
    eventsAppPushTokenSetEvent:
      type: object
      properties:
        common:
          $ref: '#/components/schemas/eventsCommon'
        token:
          type: string
      required:
      - common
      - token
    eventsCategoryPageDetails:
      type: object
      properties:
        name:
          type: string
          example: Board Games
          description: The category of the item as defined by the partner
        itemIds:
          type: array
          example:
          - '123456'
          - '789012'
          items:
            type: string
          description: The unique identifiers of the items as defined by the partner in the category on
            this specific pageview
      title: Details about the category and items on this pageview (required for category pages)
      required:
      - name
      - itemIds
    eventsCommon:
      type: object
      properties:
        identification:
          $ref: '#/components/schemas/eventsIdentification'
        agent:
          type: string
          example: partner:mparticle
          description: The agent from which the event was sent
        timestamp:
          type: string
          format: int64
          example: 1611312000
          description: The timestamp of the event in milliseconds since the unix epoch
        extra:
          type: object
          example:
            color: red
            size: large
          additionalProperties:
            type: string
          description: Any additional attributes, may be passed empty.
        websiteId:
          type: string
          format: int64
          example: 123456
          description: The unique identifier for the website as provided by Wunderkind
      required:
      - identification
      - agent
      - timestamp
      - extra
    eventsCustomEvent:
      type: object
      properties:
        common:
          $ref: '#/components/schemas/eventsCommon'
        title:
          type: string
          example: samsevent
          description: Name/title of the custom event
      required:
      - common
      - title
    eventsDeviceIdentification:
      type: object
      properties:
        ipAddress:
          type: string
          example: 192.168.0.1
          description: The IP address of the user (IPv4 or IPv6)
        userAgent:
          type: string
          example: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/58.0.3029.110
            Safari/537.3
          description: The user agent of the browser
      description: Metadata representing the device used by the user.
      required:
      - ipAddress
    eventsEmptyCartEvent:
      type: object
      properties:
        identification:
          $ref: '#/components/schemas/eventsIdentification'
        extra:
          type: object
          example:
            color: red
            size: large
          additionalProperties:
            type: string
          description: Any additional attributes, may be passed empty.
        agent:
          type: string
          example: partner:mparticle
          description: The agent from which the event was sent
        timestamp:
          type: string
          format: int64
          example: 1611312000
          description: The timestamp of the event in milliseconds since the unix epoch
        websiteId:
          type: string
          format: int64
          example: 123456
          description: The unique identifier for the website as provided by Wunderkind
      required:
      - identification
      - extra
      - agent
      - timestamp
      - websiteId
    eventsIdentification:
      type: object
      properties:
        sessionIdentification:
          $ref: '#/components/schemas/eventsSessionIdentification'
        userIdentification:
          $ref: '#/components/schemas/eventsUserIdentification'
        deviceIdentification:
          $ref: '#/components/schemas/eventsDeviceIdentification'
        source:
          $ref: '#/components/schemas/eventsSource'
        profile:
          $ref: '#/components/schemas/eventsProfile'
        location:
          $ref: '#/components/schemas/eventsLocation'
      title: Metadata used for identification of the user
      required:
      - sessionIdentification
      - userIdentification
      - deviceIdentification
      - source
    eventsItemPageDetails:
      type: object
      properties:
        itemId:
          type: string
          example: '123456'
          description: The unique identifier for the item as defined by the partner. This represents the
            parent identifier for the item. For example, if you sell similar shirts, they may have the
            same parent id, but a different sku for each size / color combination
        sku:
          type: string
          example: SKU123
          description: The SKU of the item as defined by the partner. This represents the child identifier
            for the item. For example, if you sell similar shirts, they may have the same parent id, but
            a different sku for each size / color combination. This is optional, but should be included
            if available.
        name:
          type: string
          example: Wunderkind Monopoly Board Game
          description: The name of the item as defined by the partner
        category:
          type: string
          example: Board Games
          description: The category of the item as defined by the partner
        brand:
          type: string
          example: Wunderkind
          description: The brand of the item as defined by the partner
        image:
          type: string
          example: https://example.com/image.jpg
          description: The URL of the image of the item as defined by the partner
        available:
          type: boolean
          example: true
          description: Whether the item is available for purchase
        price:
          $ref: '#/components/schemas/eventsMoney'
        attributes:
          type: object
          example:
            color: red
            size: large
          additionalProperties:
            type: string
          description: Additional attributes of the item as defined by the partner
      title: Details about the primary item on this pageview (required for item pages)
      required:
      - itemId
      - name
      - category
      - brand
      - image
      - available
      - price
      - attributes
    eventsLocation:
      type: object
      properties:
        timezoneOffset:
          type: integer
          format: int32
          example: -5
          description: The UTC timezone offset of the user
        latitude:
          type: number
          format: float
          example: 40.7128
          description: The latitude of the user
        longitude:
          type: number
          format: float
          example: -74.006
          description: The longitude of the user
    eventsMoney:
      type: object
      properties:
        amount:
          type: number
          format: double
          example: 10
          description: The amount of money
        currency:
          type: string
          example: USD
          description: The currency code
      required:
      - amount
      - currency
    eventsOrderLineItem:
      type: object
      properties:
        itemId:
          type: string
          example: '123456'
          description: The unique identifier for the item as defined by the partner. This represents the
            parent identifier for the item. For example, if you sell similar shirts, they may have the
            same parent id, but a different sku for each size / color combination
        sku:
          type: string
          example: SKU123
          description: The SKU of the item as defined by the partner. This represents the child identifier
            for the item. For example, if you sell similar shirts, they may have the same parent id, but
            a different sku for each size / color combination
        unitPrice:
          $ref: '#/components/schemas/eventsMoney'
        quantity:
          type: integer
          format: int32
          example: 2
          description: The quantity of the item in the order
      title: Details about an item in an order
      required:
      - itemId
      - sku
      - unitPrice
      - quantity
    eventsOrderTransactionEvent:
      type: object
      properties:
        identification:
          $ref: '#/components/schemas/eventsIdentification'
        orderId:
          type: string
          example: '123456'
          description: The unique identifier for the order as defined by the partner
        additionalOrderIds:
          type: object
          example:
            partner_order_id: '123456'
            shopify_order_id: '8196131534384'
          additionalProperties:
            type: string
          description: Additional order identifiers as defined by the partner. Can be useful if you have
            a printable order number for the customer, and a distinct one for your backend.
        total:
          $ref: '#/components/schemas/eventsMoney'
        shipping:
          $ref: '#/components/schemas/eventsMoney'
        tax:
          $ref: '#/components/schemas/eventsMoney'
        discounts:
          $ref: '#/components/schemas/eventsMoney'
        couponCodes:
          type: array
          example:
          - SAVE10
          - FREESHIP
          items:
            type: string
          description: The coupon codes applied to the order
        items:
          type: array
          items:
            $ref: '#/components/schemas/eventsOrderLineItem'
          description: The items in the order
        extra:
          type: object
          example:
            color: red
            size: large
          additionalProperties:
            type: string
          description: Any additional attributes, may be passed empty.
        agent:
          type: string
          example: partner:mparticle
          description: The agent from which the event was sent
        timestamp:
          type: string
          format: int64
          example: 1611312000
