aid: wunderkind
name: Wunderkind
description: >-
  Wunderkind (formerly BounceX) is a performance marketing and identity
  resolution platform that turns anonymous website and mobile-app traffic into
  triggered, one-to-one email and text messages. Its Autonomous Marketing
  Platform pairs an identity graph with AI decisioning, and its Build with
  Wunderkind developer surface exposes that machinery as APIs: an Identity API
  for device-ID-to-email resolution, an Event Ingestion API for server-side
  behavioral events, Email and Text Message send APIs, a UCRM subscribe and
  unsubscribe API, Signals webhooks that deliver behavioral triggers into ESPs
  like Klaviyo, Salesforce Marketing Cloud, Braze, and Bloomreach, plus Web and
  Mobile SDKs for Android, iOS, Flutter, and React Native.
