apis:
- aid: wunderkind:wunderkind-text-message-api
  name: Wunderkind Text Message API
  description: >-
    RESTful endpoints for delivering text messages from platforms external to the Wunderkind ecosystem
    (ESP, CDP, etc.): single and bulk sends of up to 50,000 messages per request, message status lookup,
    subscription status checks, and subscribe/unsubscribe of phone numbers. Authenticated with X-Client-ID
    and X-Client-Secret headers; rate limited to 300 requests per second per website. No OpenAPI is published
    for this API; the reference is markdown documentation.
  humanURL: https://developer.wunderkind.co/reference/text-message-api
  baseURL: https://api.wknd.ai
  tags:
  - SMS
  - Messaging
  properties:
