- aid: wunderkind:wunderkind-wunderhook-api
  name: Wunderkind Wunderhook API
  description: >-
    The Signals Wunderhook consumer contract — the single POST endpoint a client
    stands up to RECEIVE Wunderkind Signals webhook deliveries. The base URL is
    therefore templated and client-owned (https://{yourendpoint}), not a
    Wunderkind-operated host; Wunderkind is the sender. Deliveries are
    authenticated with static headers or Basic auth from a published 20-address
    IP allowlist, with no HMAC signing.
  humanURL: https://developer.wunderkind.co/reference/signalswebhook
  baseURL: https://{yourendpoint}
  tags:
  - Wunderhook
  properties:
  - type: OpenAPI
    url: openapi/wunderkind-wunderhook-api-openapi.yml
