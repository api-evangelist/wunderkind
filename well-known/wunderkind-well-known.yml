  - {url: 'https://developer.wunderkind.co/.well-known/agent-card.json', status: 404}
  - {url: 'https://developer.wunderkind.co/.well-known/agent.json', status: 404}
  - {url: 'https://api.wunderkind.co/.well-known/agent-card.json', status: 500}
  - {url: 'https://api.wunderkind.co/.well-known/agent.json', status: 500}
  - {url: 'https://api.wknd.ai/.well-known/agent-card.json', status: 404}
  - {url: 'https://api.wknd.ai/.well-known/agent.json', status: 404}
  - {url: 'https://platform.wunderkind.co/.well-known/agent-card.json', status: 200, document: false, note: SPA HTML shell}
